<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agents — Animated Office</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#eaf3ff;font:14px system-ui,-apple-system,sans-serif}header{padding:16px 20px;border-bottom:1px solid #34455e;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:3px 0}.muted,small{color:#a5b7ce}.tag{border:1px solid #37786f;border-radius:20px;padding:6px 10px;color:#76efcc;font-size:11px}main{max-width:1200px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.panel{border:1px solid #34455e;background:#17253a;border-radius:14px;overflow:hidden}.toolbar{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #4a617c;border-radius:9px;background:#293e59;color:white;padding:10px;font:inherit;cursor:pointer;touch-action:manipulation}button:active{background:#3e6080}button.primary{background:#14695d}svg{display:block;width:100%;height:auto;background:#122137}aside{display:grid;gap:12px;align-content:start}aside section{padding:14px}h2{font-size:15px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#263950;border-radius:8px;padding:10px 5px;text-align:center}.stat b{display:block;font-size:20px}.stat small{font-size:10px}.agent{display:flex;width:100%;justify-content:space-between;margin:6px 0;text-align:left}.selected{outline:2px solid #62eddb}.bar{height:7px;background:#35475c;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#62eddb;transition:width .3s}#log{max-height:180px;overflow:auto;font-size:12px;line-height:1.7;color:#b8cbe2}footer{padding:16px;text-align:center;color:#a5b7ce;font-size:12px}@media(max-width:720px){main{grid-template-columns:1fr}aside{grid-template-columns:1fr 1fr}aside section:last-child{grid-column:1/-1}}@media(max-width:440px){aside{grid-template-columns:1fr}aside section:last-child{grid-column:auto}h1{font-size:17px}}
</style></head><body>
<header><div><small>VIRTUAL OFFICE · DEMO MODE</small><h1>AI Agent Command Centre</h1></div><span class="tag" id="state">● LIVE DEMO</span></header>
<main><div class="panel"><div class="toolbar"><button class="primary" id="pause">⏸ Pause</button><button id="task">⚡ New task</button><button id="reset">↺ Reset</button><small>Tap a desk or agent</small></div>
<svg id="office" viewBox="0 0 780 550" xmlns="http://www.w3.org/2000/svg" aria-label="Animated 2D office with five AI agent desks">
<defs><pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#172840"/><path d="M40 0H0V40" fill="none" stroke="#233954"/></pattern></defs>
<rect width="780" height="550" fill="url(#tile)"/><rect x="16" y="16" width="748" height="518" rx="22" fill="none" stroke="#43627c" stroke-width="5"/>
<rect x="270" y="22" width="240" height="55" rx="12" fill="#29435c"/><text x="390" y="44" fill="#e8ffff" text-anchor="middle" font-size="17" font-weight="bold">AI OPERATIONS</text><text x="390" y="62" fill="#a9c8da" text-anchor="middle" font-size="11">Animated virtual office</text>
<path d="M390 80V145M140 145H640M140 145V205M390 145V205M640 145V205M265 145V355M515 145V355" stroke="#3d8392" stroke-width="3" stroke-dasharray="6 8" fill="none"/>
<g id="signals"></g><g id="desks"></g>
<rect x="304" y="476" width="172" height="42" rx="13" fill="#304a65"/><text x="390" y="493" text-anchor="middle" fill="#d8eaff" font-size="11">COLLABORATION HUB</text><text x="390" y="507" text-anchor="middle" fill="#74e8d8" font-size="10">● Activity stream</text>
</svg></div>
<aside><section class="panel"><h2>Office overview</h2><div class="stats"><div class="stat"><b>4/5</b><small>Active</small></div><div class="stat"><b id="completed">12</b><small>Completed</small></div><div class="stat"><b id="count">0</b><small>Events</small></div></div></section>
<section class="panel"><h2>Agents</h2><div id="agentList"></div></section>
<section class="panel"><h2 id="detailTitle">Agent details</h2><p id="detail" class="muted"></p><div class="bar"><div class="fill" id="progress"></div></div></section>
<section class="panel"><h2>Recent activity</h2><div id="log" aria-live="polite"></div></section></aside></main>
<footer>Standalone interactive demonstration. No external libraries, credentials, or connections to real agents.</footer>
<script>
(()=>{'use strict';const ns='http://www.w3.org/2000/svg',desks=document.getElementById('desks'),signals=document.getElementById('signals');
const agents=[{name:'Coordinator',role:'Assigns tasks',task:'Reviewing assignments',x:140,y:255,p:65,c:'#71e6d4'},{name:'Research',role:'Gathers information',task:'Comparing opportunities',x:390,y:255,p:48,c:'#b0a8ff'},{name:'Developer',role:'Builds software',task:'Testing dashboard',x:640,y:255,p:84,c:'#ffb77c'},{name:'Data Analyst',role:'Processes data',task:'Validating metrics',x:265,y:405,p:57,c:'#f5a2d4'},{name:'Monitor',role:'Checks system health',task:'Waiting for alerts',x:515,y:405,p:0,c:'#9ac3ff'}];
let chosen=0,paused=false,done=12,events=0,tick=0;
function node(tag,attrs,parent){let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}
function txt(g,x,y,t,size=12){let e=node('text',{x,y,'text-anchor':'middle',fill:'#eaf3ff','font-size':size,'font-weight':'600'},g);e.textContent=t}
agents.forEach((a,i)=>{let g=node('g',{style:'cursor:pointer'},desks);node('rect',{x:a.x-91,y:a.y-59,width:182,height:121,rx:14,fill:'#263d58',stroke:'#4d7091','stroke-width':2},g);node('rect',{x:a.x-69,y:a.y-44,width:138,height:51,rx:7,fill:'#aa7854'},g);node('rect',{x:a.x-39,y:a.y-40,width:78,height:38,rx:5,fill:'#081627',stroke:a.c,'stroke-width':2},g);node('rect',{x:a.x-32,y:a.y-33,width:64,height:24,rx:2,fill:'#17465b'},g);for(let j=0;j<3;j++)node('rect',{x:a.x-26,y:a.y-29+j*7,width:20+j*11,height:3,fill:a.c},g);node('rect',{x:a.x-33,y:a.y+14,width:66,height:28,rx:9,fill:'#4d6882'},g);a.face=node('circle',{cx:a.x,cy:a.y+27,r:17,fill:a.c,stroke:'#f8e6c8','stroke-width':2},g);node('circle',{cx:a.x-5,cy:a.y+25,r:2,fill:'#1d2637'},g);node('circle',{cx:a.x+5,cy:a.y+25,r:2,fill:'#1d2637'},g);txt(g,a.x,a.y+79,a.name,13);a.halo=node('rect',{x:a.x-94,y:a.y-62,width:188,height:127,rx:16,fill:'none',stroke:'#61eed9','stroke-width':3,opacity:0},g);a.light=node('circle',{cx:a.x+76,cy:a.y-46,r:6,fill:i===4?'#91a4bd':'#65ead6'},g);g.addEventListener('click',()=>select(i))});
function addLog(s){events++;document.getElementById('count').textContent=events;let d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+' · '+s;document.getElementById('log').prepend(d);while(document.getElementById('log').children.length>14)document.getElementById('log').lastChild.remove()}
function select(i){chosen=i;agents.forEach((a,j)=>a.halo.setAttribute('opacity',i===j?1:0));let a=agents[i];document.getElementById('detailTitle').textContent=a.name;document.getElementById('detail').textContent=a.role+' · '+a.task+' · '+a.p+'%';document.getElementById('progress').style.width=a.p+'%';let list=document.getElementById('agentList');list.replaceChildren();agents.forEach((a,j)=>{let b=document.createElement('button');b.className='agent'+(j===i?' selected':'');b.textContent=a.name+' · '+(j===4?'Idle':'Running');b.onclick=()=>select(j);list.appendChild(b)})}
function send(i,j){let a=agents[i],b=agents[j],p=node('circle',{cx:a.x,cy:a.y,r:5,fill:'#8cfbea'},signals),start=performance.now();function frame(t){let v=Math.min(1,(t-start)/950);p.setAttribute('cx',a.x+(b.x-a.x)*v);p.setAttribute('cy',a.y+(b.y-a.y)*v-32*Math.sin(Math.PI*v));if(v<1)requestAnimationFrame(frame);else p.remove()}requestAnimationFrame(frame)}
function task(){let i=1+Math.floor(Math.random()*4),a=agents[i];a.p=5;a.task='Processing newly assigned task';send(0,i);addLog('Coordinator assigned task to '+a.name);select(i)}
function loop(){if(!paused){tick++;agents.forEach((a,i)=>a.face.setAttribute('cy',a.y+27+Math.sin(tick/5+i)*2));if(tick%20===0){agents.slice(0,4).forEach(a=>{a.p+=Math.floor(Math.random()*5)+1;if(a.p>=100){a.p=0;done++;document.getElementById('completed').textContent=done;addLog(a.name+' completed a task')}});select(chosen)}if(tick%70===0){let i=1+Math.floor(Math.random()*4);send(i,0);addLog(agents[i].name+' sent an update')}}setTimeout(loop,160)}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause';document.getElementById('state').textContent=paused?'● PAUSED':'● LIVE DEMO'};document.getElementById('task').onclick=task;document.getElementById('reset').onclick=()=>{agents.forEach((a,i)=>a.p=i===4?0:25);done=0;document.getElementById('completed').textContent=0;addLog('Demo reset');select(0)};
select(0);addLog('Office simulation started');loop();
})();
</script></body></html>
